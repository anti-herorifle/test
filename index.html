<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scientific Calculator App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator">
        <div class="display">
            <input type="text" id="display" readonly>
            <div id="secondary-display"></div>
        </div>
        <div class="buttons">
            <!-- Scientific functions row 1 -->
            <button class="btn func" onclick="appendFunction('sin')">sin</button>
            <button class="btn func" onclick="appendFunction('cos')">cos</button>
            <button class="btn func" onclick="appendFunction('tan')">tan</button>
            <button class="btn func" onclick="appendOperator('^')">x^y</button>
            
            <!-- Scientific functions row 2 -->
            <button class="btn func" onclick="appendFunction('asin')">sin⁻¹</button>
            <button class="btn func" onclick="appendFunction('acos')">cos⁻¹</button>
            <button class="btn func" onclick="appendFunction('atan')">tan⁻¹</button>
            <button class="btn func" onclick="appendFunction('sqrt')">√</button>
            
            <!-- Additional functions row 3 -->
            <button class="btn func" onclick="appendFunction('log')">log</button>
            <button class="btn func" onclick="appendFunction('ln')">ln</button>
            <button class="btn func" onclick="toggleMode()">DEG</button>
            <button class="btn clear" onclick="clearDisplay()">C</button>
            
            <!-- Numbers and operators -->
            <button class="btn operator" onclick="deleteLast()">⌫</button>
            <button class="btn operator" onclick="appendOperator('/')">/</button>
            <button class="btn operator" onclick="appendOperator('*')">×</button>
            <button class="btn operator" onclick="appendOperator('-')">-</button>
            
            <button class="btn number" onclick="appendNumber('7')">7</button>
            <button class="btn number" onclick="appendNumber('8')">8</button>
            <button class="btn number" onclick="appendNumber('9')">9</button>
            <button class="btn operator" onclick="appendOperator('+')">+</button>
            
            <button class="btn number" onclick="appendNumber('4')">4</button>
            <button class="btn number" onclick="appendNumber('5')">5</button>
            <button class="btn number" onclick="appendNumber('6')">6</button>
            <button class="btn func" onclick="appendNumber('(')">(</button>
            
            <button class="btn number" onclick="appendNumber('1')">1</button>
            <button class="btn number" onclick="appendNumber('2')">2</button>
            <button class="btn number" onclick="appendNumber('3')">3</button>
            <button class="btn func" onclick="appendNumber(')')">)</button>
            
            <button class="btn number zero" onclick="appendNumber('0')">0</button>
            <button class="btn number" onclick="appendNumber('.')">.</button>
            <button class="btn func" onclick="convertFraction()">a/b↔d</button>
            <button class="btn equals" onclick="calculate()">=</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
